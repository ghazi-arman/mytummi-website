    <path d="M16 15.6L12.3 12 1 22.4c.4.4 1.1.5 1.9 0L16 15.6z" fill="#1be4a4"/>
    <path d="M16 8.4L2.9 1.6c-.8-.5-1.5-.4-1.9 0L12.3 12 16 8.4z" fill="url(#c)"/>
