<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 40" role="img" aria-label="Get it on Google Play">
  <title>Get it on Google Play</title>
  <rect width="135" height="40" rx="6" fill="#000"/>
  <rect x=".5" y=".5" width="134" height="39" rx="5.5" fill="none" stroke="#a6a6a6" stroke-width=".5"/>
  <!-- Play triangle -->
  <g transform="translate(10,8)">
    <defs>
      <linearGradient id="a" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#00c3ff"/>
        <stop offset="1" stop-color="#1be4a4"/>
      </linearGradient>
      <linearGradient id="b" x1="0" y1="12" x2="12" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#00c3ff"/>
        <stop offset="1" stop-color="#5b6cf0"/>
      </linearGradient>
      <linearGradient id="c" x1="12" y1="0" x2="24" y2="12" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffd000"/>
        <stop offset="1" stop-color="#f04e37"/>
      </linearGradient>
    </defs>
    <path d="M1 1.6c-.4.4-.6 1-.6 1.8v17.2c0 .8.2 1.4.6 1.8l.1.1L12.3 12v-.3L1 1.6z" fill="url(#b)"/>
