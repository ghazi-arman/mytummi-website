  <!-- Text -->
  <g fill="#fff">
    <text font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="7.5" x="40" y="15" letter-spacing=".03em">GET IT ON</text>
    <text font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" x="40" y="30" letter-spacing="-.01em">Google Play</text>
